name: Temporary Composer dependency resolution
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  resolve:
    if: github.head_ref == 'chore/composer-dependency-upgrade'
    runs-on: ubuntu-latest
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, redis, zip, gd, mbstring, bcmath, dom, curl
          tools: composer:v2
          coverage: none
      - name: Resolve dependencies
        run: |
          cat > composer.json <<'MANIFEST'
          {
              "name": "astrotomic/opendor.me",
              "description": "",
              "license": "CC-BY-NC-SA-3.0",
              "type": "project",
              "keywords": [],
              "require": {
                  "php": "~8.5.0",
                  "ext-intl": "*",
                  "ext-json": "*",
                  "ext-redis": "*",
                  "algolia/scout-extended": "^4.0",
                  "astrotomic/laravel-github-sponsors": "^1.2",
                  "astrotomic/php-open-graph": "^0.5.2",
                  "filament/filament": "^3.3.58",
                  "guzzlehttp/guzzle": "^7.17",
                  "laravel/framework": "^13.44.1",
                  "laravel/horizon": "^5.52",
                  "laravel/socialite": "^5.33.0",
                  "mallardduck/blade-boxicons": "^2.5",
                  "mazedlx/laravel-feature-policy": "^2.4",
                  "nesbot/carbon": "^3.15.1",
                  "ryangjchandler/orbit": "^1.4.3",
                  "sentry/sentry-laravel": "^4.31",
                  "spatie/eloquent-sortable": "^5.0.1",
                  "spatie/flysystem-dropbox": "^2.0.6",
                  "spatie/laravel-backup": "^10.5",
                  "spatie/laravel-csp": "^3.32",
                  "spatie/laravel-enum": "^3.3.0",
                  "spatie/laravel-schedule-monitor": "^4.3.3",
                  "spatie/laravel-sitemap": "^7.4",
                  "spatie/laravel-sluggable": "^3.8.1",
                  "stillat/numeral.php": "^2.0.2"
              },
              "require-dev": {
                  "astrotomic/phpunit-assertions": "^0.15.0",
                  "barryvdh/laravel-ide-helper": "^3.8",
                  "fakerphp/faker": "^1.24.1",
                  "fruitcake/laravel-debugbar": "^4.4.5",
                  "gajus/dindent": "^2.0.2",
                  "laravel/pint": "^1.32.3",
                  "mockery/mockery": "^1.6.15",
                  "nunomaduro/collision": "^8.9.6",
                  "pestphp/pest": "^4.7.8",
                  "pestphp/pest-plugin-laravel": "^4.1",
                  "povils/phpmnd": "^3.6.2",
                  "spatie/laravel-ignition": "^2.13",
                  "spatie/ray": "^1.48.1",
                  "tightenco/tlint": "^9.7"
              },
              "conflict": {
                  "tightenco/tlint": "5.0.16"
              },
              "autoload": {
                  "psr-4": {
                      "App\\": "app/",
                      "Database\\Factories\\": "database/factories/",
                      "Database\\Seeders\\": "database/seeders/"
                  }
              },
              "autoload-dev": {
                  "psr-4": {
                      "Tests\\": "tests/"
                  }
              },
              "config": {
                  "allow-plugins": {
                      "pestphp/pest-plugin": true,
                      "php-http/discovery": true
                  },
                  "optimize-autoloader": true,
                  "preferred-install": "dist",
                  "sort-packages": true
              },
              "extra": {
                  "composer-normalize": {
                      "indent-size": 4,
                      "indent-style": "space"
                  },
                  "laravel": {
                      "dont-discover": []
                  }
              },
              "scripts": {
                  "post-update-cmd": [
                      "@php artisan horizon:publish --ansi --no-interaction",
                      "@php artisan vendor:publish --tag=laravel-assets --ansi --no-interaction --force"
                  ],
                  "post-autoload-dump": [
                      "@composer validate --strict --ansi --no-interaction --quiet",
                      "Illuminate\\Foundation\\ComposerScripts::postAutoloadDump",
                      "@php artisan package:discover --ansi --no-interaction",
                      "@php artisan filament:upgrade"
                  ],
                  "post-root-package-install": [
                      "@php -r \"file_exists('.env') || copy('.env.example', '.env');\""
                  ],
                  "post-create-project-cmd": [
                      "@php artisan key:generate --ansi"
                  ],
                  "fix": [
                      "@php vendor/bin/pint"
                  ],
                  "ide": [
                      "@php artisan ide-helper:generate --ansi --no-interaction --quiet",
                      "@php artisan ide-helper:meta --ansi --no-interaction --quiet",
                      "@php artisan ide-helper:models --write --dir=app/Models --reset --ansi --no-interaction --quiet",
                      "@composer fix --quiet"
                  ],
                  "lint": [
                      "@php vendor/bin/phpmnd ./app",
                      "@php vendor/bin/pint --test",
                      "@php vendor/bin/tlint lint ./app --no-interaction -v"
                  ],
                  "normalize": "echo 'composer global require ergebnis/composer-normalize'",
                  "route:list": "@php artisan route:list --except-path=nova,horizon,_debugbar",
                  "test": "@php vendor/bin/pest",
                  "test-coverage": "@php vendor/bin/pest --coverage-html=.coverage",
                  "thanks": "echo 'composer global require symfony/thanks'"
              }
          }
          MANIFEST
          cp composer.json base.json
          cat > groups.json <<'GROUPS'
          [{"algolia/scout-extended":"^5.0"},{"astrotomic/php-open-graph":"^1.0"},{"astrotomic/phpunit-assertions":"^0.16"},{"filament/filament":"^5.0"},{"guzzlehttp/guzzle":"^8.0"},{"mazedlx/laravel-feature-policy":"^3.0"},{"pestphp/pest":"^5.0","pestphp/pest-plugin-laravel":"^5.0"},{"ryangjchandler/orbit":"^2.0"},{"spatie/flysystem-dropbox":"^3.0"},{"spatie/laravel-sitemap":"^8.0"},{"spatie/laravel-sluggable":"^6.0"}]
          GROUPS
          cat > apply.php <<'PHP'
          <?php
          $m=json_decode(file_get_contents($argv[1]), true);
          $groups=json_decode(file_get_contents('groups.json'), true);
          foreach (($argv[2] === 'all' ? $groups : [$groups[(int)$argv[2]]]) as $group) {
              foreach ($group as $package => $constraint) {
                  $section = isset($m['require'][$package]) ? 'require' : 'require-dev';
                  $m[$section][$package] = $constraint;
              }
          }
          file_put_contents('composer.json', json_encode($m, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE)."\n");
          PHP
          php apply.php base.json all
          if composer update --no-install --no-scripts --no-interaction --prefer-dist; then
            echo "ALL MAJOR UPGRADES RESOLVED"
          else
            cp base.json composer.json
            rm -f composer.lock
            composer update --no-install --no-scripts --no-interaction --prefer-dist
            for i in $(seq 0 10); do
              cp composer.json accepted.json
              cp composer.lock accepted.lock
              php apply.php accepted.json "$i"
              if composer update --no-install --no-scripts --no-interaction --prefer-dist; then
                echo "ACCEPTED GROUP $i"
              else
                echo "BLOCKED GROUP $i"
                cp accepted.json composer.json
                cp accepted.lock composer.lock
              fi
            done
          fi
          composer bump --no-interaction
          composer outdated --direct --major-only --locked --format=json --no-interaction || true
          composer validate --strict
      - name: Resolution output
        run: |
          echo 'COMPOSER_JSON_BEGIN'
          base64 -w 0 composer.json | fold -w 4096
          echo
          echo 'COMPOSER_JSON_END'
          echo 'COMPOSER_LOCK_BEGIN'
          gzip -c composer.lock | base64 -w 0 | fold -w 4096
          echo
          echo 'COMPOSER_LOCK_END'
      - uses: actions/upload-artifact@v4
        with:
          name: composer-resolution
          path: |
            composer.json
            composer.lock
