name: Laravel 13 temporary resolution

on:
  push:
    branches: [upgrade/laravel-13]

permissions:
  contents: read

jobs:
  pest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BROADCAST_DRIVER: log
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      DB_CONNECTION: pgsql
      DB_HOST: localhost
      REDIS_HOST: 127.0.0.1
      DB_PASSWORD: postgres
      DB_USERNAME: postgres
      DB_DATABASE: postgres
    services:
      postgres:
        image: postgres:13-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      redis:
        image: redis
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2 #https://github.com/shivammathur/setup-php
        with:
          php-version: 8.4
          extensions: dom, curl, mbstring, zip, pcntl, posix, intl, redis, pdo_pgsql
          coverage: xdebug
      - name: Resolve dependencies
        run: composer update --with-all-dependencies --minimal-changes --no-interaction --prefer-dist --no-scripts
      - name: Emit generated lockfile
        run: |
          echo "LOCKFILE_BEGIN"
          base64 -w 1000 composer.lock
          echo "LOCKFILE_END"
          git hash-object composer.lock
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict && composer check-platform-reqs
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan about && php artisan route:list && php artisan schedule:list
      - run: vendor/bin/pest --coverage-html=.coverage --coverage-text
      - run: composer lint
      - uses: actions/upload-artifact@v4
        with:
          name: Coverage
          path: ./.coverage
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Logs
          path: ./storage/logs
