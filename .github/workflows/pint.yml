on:
  push:

jobs:
  phpcs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, mbstring, zip, pcntl, posix, intl, redis, pdo_pgsql, pdo_sqlite
          coverage: none
      # Apply the advisory exception to a temporary manifest only on this runner.
      - name: Install dependencies for Laravel 10 compatibility tests
        run: |
          cp composer.json composer.json.ci-backup
          trap 'mv composer.json.ci-backup composer.json' EXIT
          composer config --json policy.advisories.ignore-id "$(jq -c '.config.policy.advisories["ignore-id"]' .github/composer/laravel-10-ci.json)"
          composer install --no-interaction --prefer-dist
      - run: vendor/bin/pint --test
