on:
  push:

jobs:
  pest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BROADCAST_DRIVER: log
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      DB_CONNECTION: pgsql
      DB_HOST: localhost
      DB_PASSWORD: postgres
      DB_USERNAME: postgres
      DB_DATABASE: postgres
    services:
      postgres:
        image: postgres:13-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      redis:
        image: redis
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2 #https://github.com/shivammathur/setup-php
        with:
          php-version: 8.3
          extensions: dom, curl, mbstring, zip, pcntl, posix, intl, redis, pdo_pgsql, pdo_sqlite
          coverage: xdebug
      # Apply the advisory exception to a temporary manifest only on this runner.
      - name: Install dependencies for Laravel 10 compatibility tests
        run: |
          cp composer.json composer.json.ci-backup
          trap 'mv composer.json.ci-backup composer.json' EXIT
          composer config --json policy.advisories.ignore-id "$(jq -c '.config.policy.advisories["ignore-id"]' .github/composer/laravel-10-ci.json)"
          composer install --no-interaction --prefer-dist
      - run: composer check-platform-reqs
      - run: cp .env.example .env && php artisan key:generate
      - name: Report dependency advisories (Laravel 10 migration only)
        run: composer audit --format=plain
        continue-on-error: true
      - run: vendor/bin/pest --coverage-html=.coverage --coverage-text
      - name: Run SQLite tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_DRIVER: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
        run: vendor/bin/pest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Composer lockfile
          path: composer.lock
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Coverage
          path: ./.coverage
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Logs
          path: ./storage/logs
